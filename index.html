<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#100f24" />
    <meta
      name="description"
      content="选择年级，探索华文星图。完成一课，前往下一个世界。"
    />
    <title>华文宇宙 · 选择年级</title>
    <link rel="stylesheet" href="universe/hub.css?v=hub-developer" />
    <link rel="stylesheet" href="shared/game-menus.css?v=numbered-tasks" />
    <link rel="stylesheet" href="shared/joystick.css" />
    <link rel="preload" href="universe/art/observatory.webp" as="image" />
    <script defer src="greenhouse/vendor/gsap.min.js"></script>
    <script type="module" src="universe/hub.js?v=hub-developer"></script>
  </head>
  <body>
    <main>
      <audio id="hub-music" src="universe/audio/Universe-background.mp3" preload="none" loop></audio>
      <audio id="hub-whoosh" src="universe/audio/whoosh.mp3" preload="auto"></audio>
      <section id="choose" class="choose">
        <div class="hero-stars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <header class="brand">
          <span aria-hidden="true">✦</span><span>华文探索</span>
          <button class="hub-music" type="button" aria-label="背景音乐" aria-pressed="false" title="播放背景音乐"><span aria-hidden="true">♫</span></button>
          <button class="hub-developer" type="button" aria-label="Developer mode" aria-haspopup="dialog" title="Developer mode"><span aria-hidden="true">&lt;/&gt;</span></button>
        </header>
        <div class="hero-copy">
          <p class="kicker">从这里出发</p>
          <h1 id="title">华文宇宙</h1>
          <p>选一个年级，去看看这一片星空。</p>
        </div>
        <section class="grade-picker" aria-labelledby="grade-title">
          <h2 id="grade-title">选择年级</h2>
          <div id="grades" class="grade-grid">
            <a class="grade-card" data-level="p2" href="?level=p2" style="--planet: #7debdc">
              <img src="universe/art/p2.webp" alt="" width="76" height="76" />
              <span><strong>二年级</strong><small>19 个世界</small></span>
            </a>
            <a class="grade-card" data-level="p3" href="?level=p3" style="--planet: #ffc479">
              <img src="universe/art/p3.webp" alt="" width="76" height="76" />
              <span><strong>三年级</strong><small>17 个世界</small></span>
            </a>
            <a class="grade-card" data-level="p5" href="?level=p5" style="--planet: #e4a0ff">
              <img src="universe/art/p5.webp" alt="" width="76" height="76" />
              <span><strong>五年级</strong><small>17 个世界</small></span>
            </a>
            <a class="grade-card" data-level="p6" href="?level=p6" style="--planet: #95bcff">
              <img src="universe/art/p6.webp" alt="" width="76" height="76" />
              <span><strong>六年级</strong><small>12 个世界</small></span>
            </a>
          </div>
          <noscript><p>请启用 JavaScript 后再打开星图。</p></noscript>
        </section>
      </section>
      <section id="map" class="map-screen" hidden aria-labelledby="map-title">
        <div class="space-backdrop" aria-hidden="true"></div>
        <canvas
          id="universe"
          tabindex="0"
          aria-label="星图。双击星球进入。按方向键移动，拖动画面转向。也可按键盘 E 进入附近的世界。"
        ></canvas>
        <div class="map-hud">
          <header class="map-header">
            <button id="back" type="button">更换年级</button>
            <div class="map-heading">
              <h1 id="map-title" tabindex="-1"></h1>
              <p id="completion"></p>
            </div>
            <div class="map-tools">
              <button id="directory" type="button">世界目录</button>
              <button class="hub-music" type="button" aria-label="背景音乐" aria-pressed="false" title="播放背景音乐"><span aria-hidden="true">♫</span></button>
              <button class="hub-developer" type="button" aria-label="Developer mode" aria-haspopup="dialog" title="Developer mode"><span aria-hidden="true">&lt;/&gt;</span></button>
            </div>
          </header>
          <p id="map-status" role="status"></p>
          <div class="map-footer">
            <div id="joystick" class="joystick" aria-label="拖动摇杆移动">
              <span></span>
            </div>
            <p class="motion-key">双击星球进入<br />方向键移动 · 拖动转向</p>
            <p class="motion-touch">轻点星球两次进入<br />摇杆移动 · 拖动转向</p>
          </div>
        </div>
      </section>
      <dialog id="world-directory" aria-labelledby="directory-title">
        <header>
          <h2 id="directory-title">世界目录</h2>
          <button id="close-directory" type="button" aria-label="关闭">
            ×
          </button>
        </header>
        <div id="world-list"></div>
      </dialog>
      <dialog id="hub-developer-dialog" class="game-panel" aria-labelledby="hub-developer-title" lang="en">
        <h2 id="hub-developer-title" tabindex="-1">Developer mode</h2>
        <div id="hub-developer-panel"></div>
      </dialog>
      <div id="warp" class="warp" hidden aria-live="polite">
        <div class="warp-rings" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="warp-copy">
          <p id="warp-kicker"></p>
          <strong id="warp-title"></strong>
          <p id="warp-detail"></p>
        </div>
      </div>

    </main>
  </body>
</html>
