<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101329" />
    <meta
      name="description"
      content="在月桥上驾驶灯车，把火种送到对岸。新加坡小学三年级华文第一课。"
    />
    <title>月桥竞速 · 三年级华文第一课</title>
    <link rel="stylesheet" href="moonbridge/game.css?v=radio-briefings" />
    <link rel="stylesheet" href="shared/comic.css" />
    <link rel="stylesheet" href="shared/game-menus.css" />
    <link rel="stylesheet" href="shared/joystick.css" />
    <link rel="stylesheet" href="shared/vocabulary.css" />
    <link rel="preload" href="moonbridge/art/prelude-1.webp" as="image" />
    <script defer src="greenhouse/vendor/gsap.min.js"></script>
    <script type="module" src="moonbridge/game.js?v=field-sounds"></script>
  </head>
  <body>
    <main>
      <canvas id="world" aria-label="月桥车站与赛道" hidden></canvas>
      <section id="home" class="home screen" aria-labelledby="title">
        <div class="home-shade"></div>
        <div class="cover">
          <p class="tag">三年级华文 · 第一课</p>
          <h1 id="title">月桥竞速</h1>
          <p class="lead">桥灯熄灭了。找出重新点灯的方法，修好灯车，把火种送到对岸。</p>
          <div class="buttons">
            <button id="start" class="gold">开始冒险</button
            ><button id="resume-test" hidden>继续课末测试</button>
          </div>
          <div class="buttons">
            <button id="home-book" hidden>词语手册</button
            ><button id="practice" hidden>词语练习</button
            ><button id="bank" hidden>题库练习</button
            ><button data-settings>声音设置</button>
          </div>
          <a class="universe-return" href="./?level=p3">返回星图</a>
          <p id="boot-status" class="note" role="status"></p>
        </div>
      </section>
      <section id="comic" hidden></section>
      <section id="hud" aria-label="游戏操作" hidden>
        <header class="hud-header">
          <div class="identity">
            <span aria-hidden="true">◈</span>
            <div><strong>月桥竞速</strong><small>三年级 · 第一课</small></div>
          </div>
          <nav aria-label="工具">
            <button id="book">
              词语手册 <span id="word-count">0 / 25</span>
            </button>
            <button
              class="round-tool"
              data-settings
              aria-label="声音设置"
              title="声音设置"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16M9 3v6m6 0v6m-5 0v6" />
              </svg>
            </button>
            <button
              id="developer"
              class="round-tool"
              aria-label="开发者模式"
              title="开发者模式"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 7-5 5 5 5m8-10 5 5-5 5m-2-12-4 14" />
              </svg>
            </button>
          </nav>
        </header>
        <section class="mission" aria-label="当前任务">
          <div class="mission-line">
            <span class="mission-wave" aria-hidden="true"
              ><i></i><i></i><i></i><i></i><i></i
            ></span>
            <div class="mission-title">
              <p id="district" class="tag">起点车站</p>
              <h2 id="objective" aria-live="polite"></h2>
            </div>
            <button
              id="speak"
              class="round-tool"
              aria-label="重听任务"
              title="重听任务"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M4 9v6h4l5 4V5L8 9H4Zm12-1a5 5 0 0 1 0 8m2-11a9 9 0 0 1 0 14"
                />
              </svg>
            </button>
          </div>
          <p id="control-hint"></p>
          <p id="voice-status" role="status" hidden></p>
        </section>
        <div id="reticle" aria-hidden="true"></div>
        <p id="toast" class="toast" role="status" hidden></p>
        <div id="drive" class="drive" hidden>
          <div><strong id="speed">时速 0</strong><span id="place"></span></div>
          <progress
            id="race-progress"
            max="1"
            value="0"
            aria-label="赛程"
          ></progress>
          <p id="race-hint"></p>
          <div class="buttons">
            <button id="left-route">走左线</button
            ><button id="right-route">走右线</button>
          </div>
        </div>
        <footer class="controls">
          <div
            id="joystick"
            class="joystick"
            role="group"
            aria-label="拖动摇杆移动"
          >
            <span></span>
          </div>
          <p class="desktop-control">
            <kbd>方向键</kbd> 移动 · <kbd>E</kbd> 互动 · 拖动画面转向
          </p>
          <div class="scene-action">
            <button id="action" class="gold">互动</button>
            <p id="held" hidden></p>
          </div>
          <p class="touch-instruction">拖动画面转向</p>
          <button
            id="radio"
            class="radio-dock"
            lang="en"
            aria-label="Open Mei’s walkie-talkie"
            title="Walkie-talkie"
            hidden
          >
            <img
              src="moonbridge/art/radio.webp"
              alt=""
              width="171"
              height="304"
            />
            <span id="unread" aria-hidden="true" hidden>
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="3" />
                <path d="m4 7 8 6 8-6" />
              </svg>
            </span>
          </button>
        </footer>
      </section>
      <dialog id="dialog" class="game-panel" aria-labelledby="dialog-title">
        <header>
          <h2 id="dialog-title" tabindex="-1"></h2>
          <button id="dialog-close" type="button" aria-label="关闭">×</button>
        </header>
        <div id="dialog-body"></div>
      </dialog>
      <section
        id="assessment"
        class="screen assessment"
        aria-labelledby="assessment-title"
        hidden
      >
        <div id="assessment-body"></div>
      </section>
    </main>
  </body>
</html>
